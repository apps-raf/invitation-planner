<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Envelope Outline & Card -->
  <g filter="url(#shadow)" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Invitation Card peaking out -->
    <rect x="136" y="100" width="240" height="180" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="none" />
    <!-- Heart badge on card -->
    <path d="M256 185 C256 160 220 145 205 165 C190 185 256 225 256 225 C256 225 322 185 307 165 C292 145 256 160 256 185 Z" fill="#EC4899" stroke="none"/>
    
    <!-- Envelope Body -->
    <rect x="96" y="160" width="320" height="240" rx="24" fill="#FFFFFF" fill-opacity="0.25" />
    <!-- Envelope Flap lines -->
    <path d="M96 160 L256 290 L416 160" />
    <path d="M96 400 L216 280" />
    <path d="M416 400 L296 280" />
  </g>

  <!-- Sparkles -->
  <circle cx="110" cy="110" r="10" fill="#FDE047" />
  <circle cx="410" cy="100" r="14" fill="#FDE047" />
  <circle cx="390" cy="420" r="8" fill="#FDE047" />
</svg>
